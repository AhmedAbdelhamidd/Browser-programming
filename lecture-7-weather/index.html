<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="exercise.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header>
        <h1>Weather Dashboard</h1>
        <p>This page loads current weather data from a public API.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>

    <main id="main">
        <section>
            <h2>Select a City</h2>

            <div class="interaction-demo">
                <button id="btnKuopio"   class="counter-btn">Kuopio</button>
                <button id="btnHelsinki" class="counter-btn">Helsinki</button>
                <button id="btnOulu"     class="counter-btn">Oulu</button>
            </div>

            <div id="weatherBox">
                <p><strong>City:</strong>        <span id="city">-</span></p>
                <p><strong>Temperature:</strong> <span id="temperature">-</span></p>
                <p><strong>Wind Speed:</strong>  <span id="wind">-</span></p>
                <p><strong>Time:</strong>        <span id="time">-</span></p>
            </div>

            <pre id="output"></pre>
        </section>
    </main>

    <footer>
        <p>Data from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></p>
        <p><small>&copy; 2026 Ahmed Abdelhamid</small></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
